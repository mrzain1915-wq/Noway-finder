name: NOWAY Finder Android APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
      - "README.md"
      - "RELEASE_NOTES.md"
  workflow_dispatch:

concurrency:
  group: finder-android-${{ github.ref }}
  cancel-in-progress: true

env:
  NOWAY_FINDER_VERSION: "1.0.0"
  NOWAY_FINDER_APK: "NOWAY-Finder-v1.0.0-Android.apk"

permissions:
  contents: read

jobs:
  build-android:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Assemble debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify package, signature, version and archive
        shell: bash
        run: |
          set -euo pipefail
          source_apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$source_apk"
          cp "$source_apk" "$NOWAY_FINDER_APK"
          unzip -tq "$NOWAY_FINDER_APK"

          build_tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$build_tools/apksigner"
          test -x "$build_tools/aapt"
          "$build_tools/apksigner" verify --verbose --print-certs "$NOWAY_FINDER_APK"
          badging="$($build_tools/aapt dump badging "$NOWAY_FINDER_APK")"
          echo "$badging" | head -1
          grep -F "package: name='com.noway.finder' versionCode='1' versionName='1.0.0-debug'" <<<"$badging"

          sha256sum "$NOWAY_FINDER_APK" > SHA256SUMS-Android.txt
          cat SHA256SUMS-Android.txt
      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            ${{ env.NOWAY_FINDER_APK }}
            SHA256SUMS-Android.txt
          if-no-files-found: error
          retention-days: 30

  publish-android-release:
    name: Publish Android v1.0.0 release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, 'Release NOWAY Finder v1.0.0'))
    needs: [build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download verified APK
        uses: actions/download-artifact@v4
        with:
          name: android-release
          path: release
      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${NOWAY_FINDER_VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" --title "NOWAY Finder v${NOWAY_FINDER_VERSION} — Android Mobile" --notes-file RELEASE_NOTES.md --latest
          else
            gh release create "$tag" release/* --target "$GITHUB_SHA" --title "NOWAY Finder v${NOWAY_FINDER_VERSION} — Android Mobile" --notes-file RELEASE_NOTES.md --latest
          fi
